<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>军棋 - 双人对战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            background: #0f3460;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 28px;
            letter-spacing: 4px;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        .player-info {
            font-size: 16px;
            font-weight: bold;
        }
        .player-info .active {
            color: #ffd700;
        }
        .player-info .inactive {
            color: #888;
        }
        .turn-indicator {
            font-size: 18px;
            color: #ffd700;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2px;
            background: #2a2a4a;
            padding: 5px;
            border-radius: 10px;
            border: 3px solid #4a4a6a;
            margin-bottom: 15px;
            aspect-ratio: 6 / 7;
        }
        .cell {
            aspect-ratio: 1;
            background: #3a3a5a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            position: relative;
            user-select: none;
            min-height: 40px;
        }
        .cell:hover {
            background: #4a4a7a;
            transform: scale(1.05);
            z-index: 2;
        }
        .cell.has-piece {
            background: #2a4a7a;
        }
        .cell.selected {
            background: #ffd700 !important;
            transform: scale(1.1);
            z-index: 3;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .cell.can-move {
            background: rgba(0, 255, 0, 0.3) !important;
            cursor: pointer;
        }
        .cell.can-attack {
            background: rgba(255, 0, 0, 0.3) !important;
            cursor: pointer;
        }
        .cell .piece {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }
        .cell .piece.red {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.2);
            border: 2px solid #ff4444;
        }
        .cell .piece.blue {
            color: #44aaff;
            background: rgba(68, 170, 255, 0.2);
            border: 2px solid #44aaff;
        }
        .cell .piece .rank {
            font-size: 16px;
        }
        .cell .piece .name {
            font-size: 10px;
            opacity: 0.8;
        }
        .cell .piece .emoji {
            font-size: 20px;
            margin-right: 2px;
        }
        .cell .highlight-move {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(0, 255, 0, 0.5);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .controls button:active {
            transform: translateY(0);
        }
        .controls button.reset {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        .controls button.reset:hover {
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }
        .message {
            text-align: center;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            min-height: 50px;
        }
        .message .win-red {
            color: #ff4444;
        }
        .message .win-blue {
            color: #44aaff;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        .legend-color.red {
            background: #ff4444;
        }
        .legend-color.blue {
            background: #44aaff;
        }
        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
            }
            .cell {
                font-size: 10px;
                min-height: 30px;
            }
            .cell .piece .rank {
                font-size: 12px;
            }
            .cell .piece .name {
                font-size: 8px;
            }
            .game-info {
                flex-direction: column;
                gap: 5px;
                text-align: center;
            }
            .controls button {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>⚔️ 军棋 · 双人对战</h1>
        <div class="legend">
            <span class="legend-item">
                <span class="legend-color red"></span> 红方 (先手)
            </span>
            <span class="legend-item">
                <span class="legend-color blue"></span> 蓝方 (后手)
            </span>
            <span class="legend-item">⚑ 军旗</span>
            <span class="legend-item">💣 炸弹</span>
            <span class="legend-item">⛰️ 地雷</span>
        </div>
        <div class="game-info">
            <div class="player-info">
                红方: <span id="redStatus" class="active">● 当前回合</span>
            </div>
            <div class="turn-indicator" id="turnIndicator">🎯 红方走棋</div>
            <div class="player-info">
                蓝方: <span id="blueStatus" class="inactive">○ 等待</span>
            </div>
        </div>
        <div class="board" id="board"></div>
        <div class="message" id="message">点击棋子选中，再点击目标移动或攻击</div>
        <div class="controls">
            <button class="reset" onclick="resetGame()">🔄 重新开局</button>
        </div>
    </div>
    <script>
        // ============================================================
        // 军棋核心逻辑 - 双人对战 (明棋模式)
        // ============================================================

        // -------- 棋子定义 --------
        const RANKS = {
            COMMANDER: 9,
            GENERAL: 8,
            CAPTAIN: 7,
            COLONEL: 6,
            MAJOR: 5,
            LIEUTENANT: 4,
            SERGEANT: 3,
            CORPORAL: 2,
            PRIVATE: 1,
            BOMB: 0,
            MINE: -1,
            FLAG: -2
        };

        const RANK_NAMES = {
            9: '司令',
            8: '军长',
            7: '师长',
            6: '旅长',
            5: '团长',
            4: '营长',
            3: '连长',
            2: '排长',
            1: '工兵',
            0: '💣',
            '-1': '⛰️',
            '-2': '⚑'
        };

        const RANK_EMOJIS = {
            9: '🎖️',
            8: '⭐',
            7: '🌟',
            6: '✨',
            5: '💫',
            4: '🌟',
            3: '⭐',
            2: '✨',
            1: '🔧',
            0: '💣',
            '-1': '⛰️',
            '-2': '⚑'
        };

        // -------- 初始布局 (每方25子) --------
        // 红方: 后两排 (行4-5) ; 蓝方: 前两排 (行0-1)
        // 行索引: 0=最上(蓝方), 5=最下(红方)
        // 列索引: 0-5

        const INIT_LAYOUT = {
            // 蓝方 (上方, 行0-1)
            blue: [
                ['FLAG', 'MINE', 'GENERAL', 'COMMANDER', 'MINE', 'BOMB'],
                ['MINE', 'CAPTAIN', 'COLONEL', 'MAJOR', 'LIEUTENANT', 'SERGEANT']
            ],
            // 红方 (下方, 行4-5)
            red: [
                ['SERGEANT', 'LIEUTENANT', 'MAJOR', 'COLONEL', 'CAPTAIN', 'MINE'],
                ['BOMB', 'MINE', 'COMMANDER', 'GENERAL', 'MINE', 'FLAG']
            ]
        };

        // 棋子类型映射
        const RANK_MAP = {
            'FLAG': RANKS.FLAG,
            'MINE': RANKS.MINE,
            'BOMB': RANKS.BOMB,
            'COMMANDER': RANKS.COMMANDER,
            'GENERAL': RANKS.GENERAL,
            'CAPTAIN': RANKS.CAPTAIN,
            'COLONEL': RANKS.COLONEL,
            'MAJOR': RANKS.MAJOR,
            'LIEUTENANT': RANKS.LIEUTENANT,
            'SERGEANT': RANKS.SERGEANT,
            'CORPORAL': RANKS.CORPORAL,
            'PRIVATE': RANKS.PRIVATE
        };

        // -------- 游戏状态 --------
        let board = []; // 6x6 二维数组, 每格: { rank, player } 或 null
        let currentPlayer = 'red'; // 'red' 或 'blue'
        let selectedPos = null; // { row, col }
        let gameOver = false;
        let moveHistory = [];

        // DOM 引用
        const boardEl = document.getElementById('board');
        const messageEl = document.getElementById('message');
        const redStatusEl = document.getElementById('redStatus');
        const blueStatusEl = document.getElementById('blueStatus');
        const turnIndicatorEl = document.getElementById('turnIndicator');

        // -------- 初始化棋盘 --------
        function initBoard() {
            board = [];
            for (let r = 0; r < 6; r++) {
                board[r] = [];
                for (let c = 0; c < 6; c++) {
                    board[r][c] = null;
                }
            }

            // 放置蓝方 (行0-1)
            for (let r = 0; r < 2; r++) {
                for (let c = 0; c < 6; c++) {
                    const key = INIT_LAYOUT.blue[r][c];
                    board[r][c] = {
                        rank: RANK_MAP[key],
                        player: 'blue',
                        type: key
                    };
                }
            }

            // 放置红方 (行4-5)
            for (let r = 0; r < 2; r++) {
                for (let c = 0; c < 6; c++) {
                    const key = INIT_LAYOUT.red[r][c];
                    board[4 + r][c] = {
                        rank: RANK_MAP[key],
                        player: 'red',
                        type: key
                    };
                }
            }

            currentPlayer = 'red';
            selectedPos = null;
            gameOver = false;
            moveHistory = [];
            updateStatus();
        }

        // -------- 获取棋子显示名 --------
        function getPieceDisplay(piece) {
            if (!piece) return '';
            const rank = piece.rank;
            const name = RANK_NAMES[rank] || '';
            const emoji = RANK_EMOJIS[rank] || '';
            return `${emoji} ${name}`;
        }

        // -------- 走法校验 --------
        function isValidMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            if (!piece) return false;

            // 目标格有己方棋子
            const target = board[toRow][toCol];
            if (target && target.player === piece.player) return false;

            // 走法限制: 只能走直线 (行或列不变)
            if (fromRow !== toRow && fromCol !== toCol) return false;

            // 距离限制: 必须相邻 (铁路线可走任意距离, 但简化版只允许相邻)
            // 简化版: 只允许走一步
            const dist = Math.abs(fromRow - toRow) + Math.abs(fromCol - toCol);
            if (dist !== 1) return false;

            // 工兵特殊: 可以走更远 (简化版暂不支持)

            // 大本营限制: 军旗不能移动
            if (piece.type === 'FLAG') return false;

            // 地雷不能移动
            if (piece.type === 'MINE') return false;

            // 炸弹不能移动 (简化版: 炸弹可以移动)
            // 按标准规则炸弹可以移动

            return true;
        }

        // -------- 吃子裁决 --------
        function resolveAttack(attacker, defender) {
            // 如果目标为空, 直接移动
            if (!defender) return { result: 'move', winner: null };

            // 攻击方是炸弹
            if (attacker.rank === RANKS.BOMB) {
                return { result: 'attack', winner: 'attacker' }; // 同归于尽
            }

            // 防御方是炸弹
            if (defender.rank === RANKS.BOMB) {
                return { result: 'attack', winner: 'defender' }; // 同归于尽
            }

            // 防御方是军旗
            if (defender.type === 'FLAG') {
                return { result: 'attack', winner: 'attacker' };
            }

            // 防御方是地雷
            if (defender.type === 'MINE') {
                // 工兵可以排雷
                if (attacker.type === 'PRIVATE') {
                    return { result: 'attack', winner: 'attacker' };
                }
                return { result: 'attack', winner: 'defender' }; // 攻击方被炸
            }

            // 常规等级比较
            if (attacker.rank > defender.rank) {
                return { result: 'attack', winner: 'attacker' };
            } else if (attacker.rank < defender.rank) {
                return { result: 'attack', winner: 'defender' };
            } else {
                // 同级同归于尽
                return { result: 'attack', winner: null };
            }
        }

        // -------- 执行走棋 --------
        function executeMove(fromRow, fromCol, toRow, toCol) {
            if (gameOver) return false;

            const piece = board[fromRow][fromCol];
            const target = board[toRow][toCol];

            // 检查是否为有效走法
            if (!isValidMove(fromRow, fromCol, toRow, toCol)) {
                messageEl.textContent = '❌ 无效走法!';
                return false;
            }

            // 解析攻击
            const result = resolveAttack(piece, target);

            let moveMsg = '';
            let winFlag = false;

            if (result.result === 'move') {
                // 单纯移动
                board[toRow][toCol] = piece;
                board[fromRow][fromCol] = null;
                moveMsg = `✅ ${getPieceDisplay(piece)} 移动到 (${toRow+1}, ${toCol+1})`;
            } else {
                // 攻击
                const attackerName = getPieceDisplay(piece);
                const defenderName = target ? getPieceDisplay(target) : '空';

                if (result.winner === null) {
                    // 同归于尽
                    board[fromRow][fromCol] = null;
                    board[toRow][toCol] = null;
                    moveMsg = `💥 ${attackerName} 与 ${defenderName} 同归于尽!`;
                } else if (result.winner === 'attacker') {
                    // 攻击方胜
                    board[toRow][toCol] = piece;
                    board[fromRow][fromCol] = null;
                    moveMsg = `⚔️ ${attackerName} 消灭了 ${defenderName}!`;

                    // 检查是否吃掉军旗
                    if (target && target.type === 'FLAG') {
                        winFlag = true;
                        gameOver = true;
                        const winner = piece.player === 'red' ? '红方' : '蓝方';
                        messageEl.innerHTML = `🎉 <span class="win-${piece.player}">${winner}</span> 夺取军旗, 获得胜利! 🎉`;
                        updateStatus();
                        renderBoard();
                        return true;
                    }
                } else {
                    // 防御方胜 (攻击方被消灭)
                    board[fromRow][fromCol] = null;
                    // 防御方保留
                    moveMsg = `💀 ${attackerName} 攻击失败, 被 ${defenderName} 消灭!`;
                }
            }

            // 记录走法
            moveHistory.push({
                from: { row: fromRow, col: fromCol },
                to: { row: toRow, col: toCol },
                piece: piece,
                target: target,
                result: result
            });

            // 检查一方是否无子可走 (胜利条件2: 消灭所有可移动棋子)
            if (!gameOver) {
                const redAlive = countAlive('red');
                const blueAlive = countAlive('blue');
                if (redAlive === 0) {
                    gameOver = true;
                    messageEl.innerHTML = '🎉 <span class="win-blue">蓝方</span> 消灭所有红方棋子, 获得胜利! 🎉';
                } else if (blueAlive === 0) {
                    gameOver = true;
                    messageEl.innerHTML = '🎉 <span class="win-red">红方</span> 消灭所有蓝方棋子, 获得胜利! 🎉';
                }
            }

            if (!gameOver) {
                // 切换玩家
                currentPlayer = (currentPlayer === 'red' ? 'blue' : 'red');
                messageEl.textContent = moveMsg;
            }

            // 清除选中
            selectedPos = null;
            updateStatus();
            renderBoard();
            return true;
        }

        // -------- 统计存活棋子 --------
        function countAlive(player) {
            let count = 0;
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 6; c++) {
                    const p = board[r][c];
                    if (p && p.player === player && p.type !== 'FLAG') {
                        // 炸弹和地雷也算可移动棋子
                        count++;
                    }
                }
            }
            return count;
        }

        // -------- 更新状态显示 --------
        function updateStatus() {
            const isRedTurn = currentPlayer === 'red' && !gameOver;
            const isBlueTurn = currentPlayer === 'blue' && !gameOver;

            redStatusEl.textContent = isRedTurn ? '● 当前回合' : '○ 等待';
            redStatusEl.className = isRedTurn ? 'active' : 'inactive';
            blueStatusEl.textContent = isBlueTurn ? '● 当前回合' : '○ 等待';
            blueStatusEl.className = isBlueTurn ? 'active' : 'inactive';

            if (gameOver) {
                turnIndicatorEl.textContent = '🏁 游戏结束';
            } else {
                turnIndicatorEl.textContent = `🎯 ${currentPlayer === 'red' ? '红方' : '蓝方'}走棋`;
            }
        }

        // -------- 渲染棋盘 --------
        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 6; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    const piece = board[r][c];

                    // 选中高亮
                    if (selectedPos && selectedPos.row === r && selectedPos.col === c) {
                        cell.classList.add('selected');
                    }

                    // 可走位置高亮
                    if (selectedPos) {
                        if (isValidMove(selectedPos.row, selectedPos.col, r, c)) {
                            const target = board[r][c];
                            if (target && target.player !== board[selectedPos.row][selectedPos.col].player) {
                                cell.classList.add('can-attack');
                            } else if (!target) {
                                cell.classList.add('can-move');
                            }
                        }
                    }

                    if (piece) {
                        cell.classList.add('has-piece');
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = `piece ${piece.player}`;

                        const rankSpan = document.createElement('span');
                        rankSpan.className = 'rank';
                        rankSpan.textContent = piece.rank >= 0 ? piece.rank : '';

                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'name';
                        nameSpan.textContent = RANK_NAMES[piece.rank] || '';

                        const emojiSpan = document.createElement('span');
                        emojiSpan.className = 'emoji';
                        emojiSpan.textContent = RANK_EMOJIS[piece.rank] || '';

                        pieceDiv.appendChild(emojiSpan);
                        pieceDiv.appendChild(rankSpan);
                        pieceDiv.appendChild(nameSpan);
                        cell.appendChild(pieceDiv);

                        // 点击事件
                        cell.addEventListener('click', () => onCellClick(r, c));
                    } else {
                        cell.addEventListener('click', () => onCellClick(r, c));
                    }

                    boardEl.appendChild(cell);
                }
            }
        }

        // -------- 点击处理 --------
        function onCellClick(row, col) {
            if (gameOver) return;

            const piece = board[row][col];

            // 如果已选中, 尝试走棋
            if (selectedPos) {
                const fromRow = selectedPos.row;
                const fromCol = selectedPos.col;
                const fromPiece = board[fromRow][fromCol];

                // 点击目标格
                if (row === fromRow && col === fromCol) {
                    // 取消选中
                    selectedPos = null;
                    renderBoard();
                    return;
                }

                // 如果目标格有己方棋子, 切换到选择该棋子
                if (piece && piece.player === currentPlayer) {
                    selectedPos = { row, col };
                    renderBoard();
                    return;
                }

                // 尝试走棋
                if (fromPiece && fromPiece.player === currentPlayer) {
                    const success = executeMove(fromRow, fromCol, row, col);
                    if (!success) {
                        // 走棋失败, 取消选中
                        selectedPos = null;
                        renderBoard();
                    }
                    // 成功时已经在 executeMove 中重新渲染了
                    return;
                }

                selectedPos = null;
                renderBoard();
                return;
            }

            // 未选中: 选择己方棋子
            if (piece && piece.player === currentPlayer) {
                selectedPos = { row, col };
                renderBoard();
                messageEl.textContent = `选中 ${getPieceDisplay(piece)}，点击目标位置`;
            } else {
                messageEl.textContent = `请选择 ${currentPlayer === 'red' ? '红方' : '蓝方'} 的棋子`;
            }
        }

        // -------- 重置游戏 --------
        function resetGame() {
            initBoard();
            renderBoard();
            messageEl.textContent = '🔄 新游戏开始! 红方先走';
            selectedPos = null;
            gameOver = false;
            updateStatus();
        }

        // -------- 启动游戏 --------
        initBoard();
        renderBoard();
        messageEl.textContent = '🎮 游戏开始! 红方先走, 点击棋子选中再点击目标';
        updateStatus();

        // 暴露给HTML按钮
        window.resetGame = resetGame;
    </script>
</body>
</html>
