<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>军棋棋盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: #0a0a1a;
            touch-action: none;
        }

        /* ===== 背景 ===== */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(30, 60, 120, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(60, 30, 80, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(20, 40, 80, 0.4) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a1a 0%, #12122a 40%, #1a1a3a 100%);
            z-index: 0;
        }

        /* 纹理叠加 */
        .bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 30% 40%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(255, 215, 0, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }

        .bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.01) 2px, rgba(255, 255, 255, 0.01) 4px);
            pointer-events: none;
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 6px;
        }

        /* ===== 标题 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            flex-shrink: 0;
            min-height: 36px;
        }
        .header h1 {
            font-size: clamp(14px, 3vw, 24px);
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.15), 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
        }
        .header .sub {
            font-size: clamp(10px, 1.6vw, 14px);
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        /* ===== 图例 ===== */
        .legend {
            display: flex;
            justify-content: center;
            gap: clamp(6px, 1.5vw, 16px);
            flex-shrink: 0;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: clamp(9px, 1.4vw, 12px);
            color: rgba(255, 255, 255, 0.6);
        }
        .legend-dot {
            width: clamp(12px, 1.8vw, 18px);
            height: clamp(12px, 1.8vw, 18px);
            border-radius: 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .legend-dot.normal { background: #3a3a6a; }
        .legend-dot.camp { background: #1a6a3a; border-color: #3a8a5a; }
        .legend-dot.base { background: #6a2a2a; border-color: #8a4a4a; }
        .legend-dot.rail { background: #5a5a7a; }

        /* ===== 棋盘容器 ===== */
        .board-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            width: 100%;
            height: 100%;
            aspect-ratio: 5 / 12;
            max-width: min(85vh, 95vw);
            max-height: 95vh;
            padding: 2px;
            background:
                radial-gradient(ellipse at center, rgba(30, 40, 80, 0.5) 0%, transparent 70%);
            border-radius: 8px;
        }

        /* ===== 格子 ===== */
        .cell {
            aspect-ratio: 1;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.15s;
            min-height: 0;
            min-width: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* 兵站 */
        .cell.normal {
            background: linear-gradient(145deg, rgba(50, 50, 90, 0.6), rgba(30, 30, 60, 0.8));
            border-color: rgba(255, 255, 255, 0.06);
        }
        .cell.normal::before {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 2px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.04), transparent 70%);
            pointer-events: none;
        }

        /* 行营 - 安全区 */
        .cell.camp {
            background: radial-gradient(ellipse at center, rgba(26, 106, 58, 0.5), rgba(10, 50, 30, 0.8));
            border: 2px solid rgba(58, 138, 90, 0.5);
            box-shadow: inset 0 0 20px rgba(58, 138, 90, 0.1), 0 0 15px rgba(58, 138, 90, 0.05);
        }
        .cell.camp::after {
            content: '🏕';
            font-size: clamp(12px, 2.5vw, 24px);
            opacity: 0.3;
            position: absolute;
        }

        /* 大本营 */
        .cell.base {
            background: radial-gradient(ellipse at center, rgba(106, 42, 42, 0.6), rgba(50, 20, 20, 0.9));
            border: 2px solid rgba(138, 74, 74, 0.5);
            box-shadow: inset 0 0 20px rgba(138, 74, 74, 0.1), 0 0 15px rgba(138, 74, 74, 0.05);
        }
        .cell.base::after {
            content: '🏰';
            font-size: clamp(12px, 2.5vw, 24px);
            opacity: 0.3;
            position: absolute;
        }

        /* ===== 铁路线 ===== */
        .cell.rail-h {
            border-top: 3px solid rgba(90, 90, 130, 0.6);
            border-bottom: 3px solid rgba(90, 90, 130, 0.6);
        }
        .cell.rail-v {
            border-left: 3px solid rgba(90, 90, 130, 0.6);
            border-right: 3px solid rgba(90, 90, 130, 0.6);
        }
        .cell.rail-hv {
            border: 3px solid rgba(90, 90, 130, 0.6);
        }

        /* 铁路发光 */
        .cell.rail-h::before,
        .cell.rail-v::before,
        .cell.rail-hv::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 4px;
            background: linear-gradient(90deg, transparent, rgba(100, 100, 180, 0.05), transparent);
            pointer-events: none;
        }

        /* ===== 坐标 ===== */
        .cell .coord {
            position: absolute;
            font-size: clamp(6px, 1vw, 10px);
            color: rgba(255, 255, 255, 0.15);
            font-weight: 300;
            pointer-events: none;
            font-family: monospace;
        }
        .cell .coord.top { top: 1px; left: 3px; }
        .cell .coord.bottom { bottom: 1px; right: 3px; }

        /* ===== 分割线 (中线) ===== */
        .board .row-divider {
            display: none;
        }

        /* ===== 交互状态 ===== */
        .cell.clickable {
            cursor: pointer;
        }
        .cell.clickable:active {
            transform: scale(0.92);
        }
        .cell .piece-indicator {
            font-size: clamp(10px, 2vw, 20px);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* ===== 底部信息 ===== */
        .footer {
            display: flex;
            justify-content: center;
            gap: clamp(10px, 2vw, 24px);
            flex-shrink: 0;
            padding: 4px 12px;
            font-size: clamp(9px, 1.4vw, 12px);
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.5px;
        }
        .footer span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .footer .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .footer .dot.red { background: #ff4444; box-shadow: 0 0 10px rgba(255, 68, 68, 0.3); }
        .footer .dot.blue { background: #44aaff; box-shadow: 0 0 10px rgba(68, 170, 255, 0.3); }

        /* ===== 响应式 ===== */
        @media (max-width: 500px) {
            .container { padding: 4px; gap: 4px; }
            .header { padding: 2px 8px; min-height: 28px; }
            .legend { padding: 3px 6px; gap: 4px; border-radius: 6px; }
            .board-wrapper { border-radius: 8px; padding: 2px; }
            .board { gap: 1.5px; padding: 1.5px; }
            .cell { border-radius: 3px; }
            .cell.camp::after,
            .cell.base::after { font-size: clamp(10px, 2.5vw, 16px); }
            .cell.rail-h { border-top-width: 2px; border-bottom-width: 2px; }
            .cell.rail-v { border-left-width: 2px; border-right-width: 2px; }
            .cell.rail-hv { border-width: 2px; }
            .footer { padding: 2px 8px; font-size: clamp(7px, 1.2vw, 10px); }
        }

        @media (max-width: 380px) {
            .container { padding: 2px; gap: 2px; }
            .header h1 { font-size: 12px; }
            .board { gap: 1px; padding: 1px; }
            .cell { border-radius: 2px; }
            .legend-item { font-size: 7px; }
            .legend-dot { width: 10px; height: 10px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .header { min-height: 24px; }
            .header h1 { font-size: clamp(12px, 2.5vh, 18px); }
            .legend { padding: 2px 6px; gap: 3px; }
            .legend-item { font-size: clamp(7px, 1.2vh, 10px); }
            .footer { font-size: clamp(7px, 1.2vh, 10px); }
            .board-wrapper { border-radius: 6px; }
        }
    </style>
</head>
<body>

<div class="bg"></div>

<div class="container">
    <!-- 标题 -->
    <div class="header">
        <h1>⚔ 军棋</h1>
        <span class="sub">棋盘</span>
    </div>

    <!-- 图例 -->
    <div class="legend">
        <span class="legend-item"><span class="legend-dot normal"></span>兵站</span>
        <span class="legend-item"><span class="legend-dot camp"></span>行营</span>
        <span class="legend-item"><span class="legend-dot base"></span>大本营</span>
        <span class="legend-item"><span class="legend-dot rail"></span>铁路</span>
    </div>

    <!-- 棋盘 -->
    <div class="board-wrapper">
        <div class="board" id="board"></div>
    </div>

    <!-- 底部 -->
    <div class="footer">
        <span><span class="dot red"></span> 红方</span>
        <span>│</span>
        <span><span class="dot blue"></span> 蓝方</span>
        <span>│</span>
        <span>12行 × 5列</span>
        <span>│</span>
        <span>60 停靠点</span>
    </div>
</div>

<script>
    // ================================================================
    // 标准军棋棋盘数据 (12行 × 5列)
    // ================================================================

    const BOARD_MAP = [];

    // 行0: 蓝方底线
    BOARD_MAP[0] = [
        { type: 'normal', railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'base',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'normal', railH: false, railV: false }
    ];

    // 行1: 蓝方二线
    BOARD_MAP[1] = [
        { type: 'normal', railH: false, railV: false },
        { type: 'camp',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'camp',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: false }
    ];

    // 行2: 蓝方三线
    BOARD_MAP[2] = [
        { type: 'camp',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'normal', railH: true,  railV: false },
        { type: 'normal', railH: true,  railV: false },
        { type: 'camp',   railH: false, railV: false }
    ];

    // 行3: 蓝方四线
    BOARD_MAP[3] = [
        { type: 'normal', railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'normal', railH: true,  railV: false },
        { type: 'normal', railH: true,  railV: false },
        { type: 'normal', railH: false, railV: false }
    ];

    // 行4: 蓝方五线
    BOARD_MAP[4] = [
        { type: 'normal', railH: false, railV: false },
        { type: 'camp',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'camp',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: false }
    ];

    // 行5: 蓝方底线
    BOARD_MAP[5] = [
        { type: 'normal', railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'normal', railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'normal', railH: false, railV: false }
    ];

    // 行6: 红方底线
    BOARD_MAP[6] = [
        { type: 'normal', railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'normal', railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'normal', railH: false, railV: false }
    ];

    // 行7: 红方二线
    BOARD_MAP[7] = [
        { type: 'normal', railH: false, railV: false },
        { type: 'camp',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'camp',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: false }
    ];

    // 行8: 红方三线
    BOARD_MAP[8] = [
        { type: 'normal', railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'normal', railH: true,  railV: false },
        { type: 'normal', railH: true,  railV: false },
        { type: 'normal', railH: false, railV: false }
    ];

    // 行9: 红方四线
    BOARD_MAP[9] = [
        { type: 'camp',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'normal', railH: true,  railV: false },
        { type: 'normal', railH: true,  railV: false },
        { type: 'camp',   railH: false, railV: false }
    ];

    // 行10: 红方五线
    BOARD_MAP[10] = [
        { type: 'normal', railH: false, railV: false },
        { type: 'camp',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'camp',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: false }
    ];

    // 行11: 红方底线
    BOARD_MAP[11] = [
        { type: 'normal', railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'base',   railH: false, railV: false },
        { type: 'normal', railH: false, railV: true  },
        { type: 'normal', railH: false, railV: false }
    ];

    // ================================================================
    // 渲染
    // ================================================================

    const boardEl = document.getElementById('board');
    const cols = 'ABCDE';

    for (let r = 0; r < 12; r++) {
        for (let c = 0; c < 5; c++) {
            const cell = document.createElement('div');
            const data = BOARD_MAP[r][c];

            cell.className = `cell ${data.type}`;

            // 铁路样式
            if (data.railH && data.railV) cell.classList.add('rail-hv');
            else if (data.railH) cell.classList.add('rail-h');
            else if (data.railV) cell.classList.add('rail-v');

            // 坐标
            const coordTop = document.createElement('span');
            coordTop.className = 'coord top';
            coordTop.textContent = cols[c];
            cell.appendChild(coordTop);

            const coordBottom = document.createElement('span');
            coordBottom.className = 'coord bottom';
            coordBottom.textContent = r + 1;
            cell.appendChild(coordBottom);

            // 行营/大本营 标记
            if (data.type === 'camp' || data.type === 'base') {
                // 用伪元素显示图标，不需要额外元素
            }

            boardEl.appendChild(cell);
        }
    }
</script>

</body>
</html>
